# Founder ERP — single-instance deployment.
#
# One organisation per deployment: the application is single-tenant, so each
# organisation gets its own database and its own containers.
#
#   cp .env.example .env && ./scripts/gen-secrets.sh   # fill in secrets
#   docker compose up -d
#
# Only the frontend is published, on 127.0.0.1. The API is reachable only from
# inside this project's network: the frontend proxy is the authentication
# boundary, so the API must never be exposed directly.
#
# Redis and the Celery worker drive the AI and integration features (note
# analysis, task extraction, contact enrichment, Plaid/QBO/Gmail sync). Core
# CRM, projects, funding, invoicing and FP&A do not need them, so they sit
# behind the `full` profile:
#
#   docker compose --profile full up -d

name: ${COMPOSE_PROJECT_NAME:-founder_erp}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${INSTANCE:-founder_erp}_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-founder_erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-founder_erp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-founder_erp}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [founder_net]

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: founder-erp-api:latest
    container_name: ${INSTANCE:-founder_erp}_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-founder_erp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-founder_erp}
      # Empty unless you run --profile full; the API reports "not configured"
      # rather than degraded when Redis is absent.
      REDIS_URL: ${REDIS_URL:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set INTERNAL_API_SECRET in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      USER_KEY_SECRET: ${USER_KEY_SECRET:-}
      TZ: ${TZ:-UTC}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [founder_net]

  frontend:
    build:
      context: ./frontend
      target: runner
    image: founder-erp-frontend:latest
    container_name: ${INSTANCE:-founder_erp}_frontend
    restart: unless-stopped
    environment:
      API_URL: http://api:8000/api
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL in .env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8110}:3000"
    depends_on: [api]
    networks: [founder_net]

  # ── optional: AI and integration features ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ${INSTANCE:-founder_erp}_redis
    restart: unless-stopped
    profiles: [full]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [founder_net]

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: founder-erp-api:latest
    container_name: ${INSTANCE:-founder_erp}_worker
    restart: unless-stopped
    profiles: [full]
    command: celery -A app.worker worker --loglevel=info --beat --max-tasks-per-child=50
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-founder_erp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-founder_erp}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TZ: ${TZ:-UTC}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [founder_net]

networks:
  founder_net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
